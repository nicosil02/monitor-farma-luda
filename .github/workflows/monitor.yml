name: Monitor LUDA

on:
  schedule:
    # Una vez al dia, 06 UTC (07 Madrid invierno, 08 verano): resumen por
    # Telegram + LUDA en los medios por correo. Antes habia alertas cada 2 h;
    # se pidio cada 24 h (2026-10-30).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      resumen:
        description: 'Mandar el resumen del dia ahora'
        type: boolean
        default: false

concurrency:
  group: monitor-luda   # una sola corrida a la vez: comparten monitor.db
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Misma cuenta remitente que monitor-avisos (secret copiado a este repo)
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}     # repo publico: los correos van como secret
      EMAIL_CC: ${{ secrets.EMAIL_CC }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # Mismo patron que refrescar-pe.yml del Radar: clave nueva por corrida,
      # se restaura la ultima. Sin esto se pierden la linea base de AEMPS y
      # el registro de menciones ya enviadas (se repetirian alertas).
      - name: Base (persiste entre corridas)
        uses: actions/cache@v5
        with:
          path: monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: monitor-db-

      - name: Modelo de embeddings (Hugging Face)
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small

      - name: Dependencias
        run: |
          # torch CPU: el de PyPI trae CUDA (~2.5 GB) que aca no sirve
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Resumen del dia (Telegram) y LUDA en los medios (correo)
        run: python monitor.py

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reporte-${{ github.run_id }}
          path: reportes/
          if-no-files-found: ignore
          retention-days: 30
